name: deployment-pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.mp4'

permissions:
  contents: write

jobs:
  commit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: '5.4'
      - uses: leafo/gh-actions-luarocks@v6
      - id: install-dependencies
        run: make dependencies
      - id: test
        run: make test
      - id: install-hammerspoon
        uses: brennovich/action-setup-hammerspoon@v1
      - id: create-package
        run: make build
      - id: verify-artifact
        run: |
          test -f release/VirtualSpaces.spoon.zip
          unzip -t release/VirtualSpaces.spoon.zip
      - id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: release/VirtualSpaces.spoon.zip

  acceptance:
    needs: [commit]
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
      - id: install-hammerspoon
        uses: brennovich/action-setup-hammerspoon@v1
        with:
          accessibility-permissions: true
      - id: extract-spoon
        run: |
          mkdir -p ~/.hammerspoon/Spoons
          unzip VirtualSpaces.spoon.zip -d ~/.hammerspoon/Spoons/
      - id: run-acceptance-tests
        run: make test/acceptance

  release:
    needs: [acceptance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          patchAll: true
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
      - id: create-tag
        run: |
          git tag ${{ steps.semver.outputs.next }}
          git push origin ${{ steps.semver.outputs.next }}
      - id: create-release
        run: gh release create ${{ steps.semver.outputs.next }} VirtualSpaces.spoon.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
